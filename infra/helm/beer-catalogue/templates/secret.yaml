apiVersion: v1
kind: Secret
metadata:
  name: {{ include "beer-catalogue.fullname" . }}-secret
  labels:
    {{- include "beer-catalogue.labels" . | nindent 4 }}
type: Opaque
# stringData: Helm encodes values to base64 automatically — no manual encoding needed.
# db.password is injected via --set at deploy time and is never stored in committed files.
stringData:
  DB_USER: {{ .Values.db.user | quote }}
  DB_PASSWORD: {{ .Values.db.password | quote }}
