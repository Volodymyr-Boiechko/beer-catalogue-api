apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "beer-catalogue.fullname" . }}-config
  labels:
    {{- include "beer-catalogue.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.springProfile | quote }}
  DB_HOST: {{ .Values.db.host | quote }}
  DB_PORT: {{ .Values.db.port | quote }}
  DB_NAME: {{ .Values.db.name | quote }}
